---
- name: Base configuration of PVE nodes
  hosts: pve
  gather_facts: true
  tasks:
    - name: Disable enterprise repos (PVE 9 / deb822 format)
      ansible.builtin.file:
        path: "/etc/apt/sources.list.d/{{ item }}"
        state: absent
      loop:
        - pve-enterprise.sources
        - ceph.sources

    - name: Add pve-no-subscription repo
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/pve-no-subscription.sources
        content: |
          Types: deb
          URIs: http://download.proxmox.com/debian/pve
          Suites: trixie
          Components: pve-no-subscription
          Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
        mode: "0644"

    # On pourrait faire upgrade: full aussi mais dist c'est la version historique avec apt-get et c'est plus stable
    - name: Full update/upgrade
      ansible.builtin.apt:
        update_cache: true
        upgrade: full

    # User fait référence à l'utilisateur pour qui on installe la cle
    - name: Deploy mgmt01 SSH key for root
      ansible.posix.authorized_key:
        user: root
        key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"

    - name: Populate /etc/hosts with all lab hosts
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} POC LAB"
        block: |
          10.10.10.11 pve-node-1.{{ domain }} pve-node-1
          10.10.10.12 pve-node-2.{{ domain }} pve-node-2
          10.10.10.13 pve-node-3.{{ domain }} pve-node-3

    - name: Generate root keypair on each node
      community.crypto.openssh_keypair:
        path: /root/.ssh/id_ed25519
        type: ed25519
      register: nodekey

    - name: Authorize every node's key on every node
      ansible.posix.authorized_key:
        user: root
        key: "{{ hostvars[item].nodekey.public_key }}"
      loop: "{{ groups['pve'] }}"

    - name: Pre-accept host keys between nodes
      ansible.builtin.shell: |
        for host in 10.10.10.11 10.10.10.12 10.10.10.13; do
          ssh-keyscan -H "$host" >> /root/.ssh/known_hosts
        done
      changed_when: true

